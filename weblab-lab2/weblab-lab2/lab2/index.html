<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSONPlaceholder Blog Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>Панель управления постами</h1>
        </div>
    </header>

    <main class="container main-layout">
        <section class="form-section">
            <h2>Новый пост</h2>
            <form id="postForm">
                <div class="form-group">
                    <label for="title">Заголовок</label>
                    <input type="text" id="title" name="title" required placeholder="Введите заголовок...">
                </div>
                <div class="form-group">
                    <label for="body">Текст поста</label>
                    <textarea id="body" name="body" rows="4" required placeholder="Напишите что-нибудь..."></textarea>
                </div>
                <button type="submit" id="submitBtn" class="btn btn-primary">Опубликовать</button>
            </form>
            <div id="statusMessage" class="status-message"></div>
        </section>

        <section class="posts-section">
            <div class="section-header">
                <h2>Лента постов</h2>
                <button id="reloadBtn" class="btn btn-secondary">Обновить список</button>
            </div>
            
            <div id="loader" class="loader hidden">Загрузка данных...</div>
            
            <div id="postsContainer" class="posts-grid"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
